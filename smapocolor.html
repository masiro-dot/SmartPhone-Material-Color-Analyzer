<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MATERIAL ANALYZER</title>
    <style>
        :root {
            --bg-glass: rgba(0, 0, 0, 0.8);
            --border-glass: rgba(255, 255, 255, 0.2);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, sans-serif;
            height: 100dvh;
            overflow: hidden;
        }

        /* 1. プレビューエリア：画像を動かせるように変更 */
        #viewer-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* はみ出た画像を見せない */
            touch-action: none; /* ブラウザのデフォルトスクロールを無効化 */
        }

        #video, #uploaded-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.05s linear; /* 滑らかな動き */
        }

        /* 2. 中央の固定照準（ここが計測点になる） */
        #aimer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 1px solid #fff;
            border-radius: 50%;
            z-index: 10;
            pointer-events: none; /* 操作の邪魔をしない */
        }
        #aimer::before { content: ''; position: absolute; top: 50%; left: -15px; width: 70px; height: 1px; background: #fff; }
        #aimer::after { content: ''; position: absolute; left: 50%; top: -15px; width: 1px; height: 70px; background: #fff; }

        /* GUIパネル */
        .gui-panel {
            position: absolute;
            bottom: calc(20px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: var(--bg-glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: var(--border-glass);
            border-radius: 20px;
            padding: 18px;
            box-sizing: border-box;
            z-index: 100;
        }

        .status { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        #color-preview { width: 60px; height: 60px; border-radius: 12px; border: 1px solid #fff; }
        #hex-value { font-size: 24px; font-weight: 200; margin: 0; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn {
            height: 48px; background: rgba(255,255,255,0.1); border: 1px solid var(--border-glass);
            border-radius: 10px; color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 600; cursor: pointer;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="viewer-container">
    <video id="video" autoplay playsinline muted></video>
    <img id="uploaded-image" style="display:none;">
    <canvas id="hidden-canvas" style="display:none;"></canvas>
    <div id="aimer"></div>
</div>

<div class="gui-panel">
    <div class="status">
        <div id="color-preview"></div>
        <div>
            <h2 id="hex-value">#------</h2>
            <div id="rgb-label" style="font-size:11px; color:gray;">R:-- G:-- B:--</div>
        </div>
    </div>
    <div class="controls">
        <label class="btn">LOAD IMAGE<input type="file" id="file-input" accept="image/*"></label>
        <button id="hold-btn" class="btn">HOLD</button>
    </div>
</div>

<script>
    const container = document.getElementById('viewer-container');
    const video = document.getElementById('video');
    const image = document.getElementById('uploaded-image');
    const canvas = document.getElementById('hidden-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    const colorPreview = document.getElementById('color-preview');
    const hexText = document.getElementById('hex-value');
    const rgbText = document.getElementById('rgb-label');

    let posX = 0, posY = 0, scale = 1;
    let isHolding = false;

    // --- カメラ・ファイル処理 ---
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(s => video.srcObject = s);

    document.getElementById('file-input').addEventListener('change', e => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = f => {
                image.src = f.target.result;
                image.style.display = 'block';
                video.style.display = 'none';
                posX = 0; posY = 0; scale = 1; // リセット
                updateTransform();
            };
            reader.readAsDataURL(file);
        }
    });

    // --- ドラッグ操作 (画像を動かす) ---
    let startX, startY;
    container.addEventListener('pointerdown', e => {
        startX = e.clientX - posX;
        startY = e.clientY - posY;
        container.setPointerCapture(e.pointerId);
    });

    container.addEventListener('pointermove', e => {
        if (e.buttons !== 1) return;
        posX = e.clientX - startX;
        posY = e.clientY - startY;
        updateTransform();
    });

    function updateTransform() {
        const target = (image.style.display === 'block') ? image : video;
        target.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }

    // --- 色解析コア ---
    function analyze() {
        if (isHolding) return;
        const source = (image.style.display === 'block') ? image : video;
        if (source.tagName === 'VIDEO' && video.readyState < 2) return;
        if (source.tagName === 'IMG' && !image.complete) return;

        // 表示されている通りの見た目をキャンバスに再現して、中心の色を抜く
        canvas.width = window.innerWidth / 4; // 軽量化のため1/4サイズ
        canvas.height = window.innerHeight / 4;
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        ctx.save();
        ctx.translate(centerX + posX/4, centerY + posY/4);
        ctx.scale(scale, scale);
        
        // 画像/ビデオのサイズに合わせて描画
        const aspect = source.videoWidth ? (source.videoWidth / source.videoHeight) : (source.naturalWidth / source.naturalHeight);
        let dw, dh;
        if (aspect > canvas.width/canvas.height) {
            dw = canvas.width; dh = dw / aspect;
        } else {
            dh = canvas.height; dw = dh * aspect;
        }
        ctx.drawImage(source, -dw/2, -dh/2, dw, dh);
        ctx.restore();

        const p = ctx.getImageData(centerX, centerY, 1, 1).data;
        const hex = "#" + ((1 << 24) + (p[0] << 16) + (p[1] << 8) + p[2]).toString(16).slice(1).toUpperCase();

        colorPreview.style.backgroundColor = hex;
        hexText.innerText = hex;
        rgbText.innerText = `R:${p[0]} G:${p[1]} B:${p[2]}`;
    }

    setInterval(analyze, 100);

    document.getElementById('hold-btn').addEventListener('click', () => {
        isHolding = !isHolding;
        document.getElementById('hold-btn').style.background = isHolding ? "rgba(255,0,0,0.3)" : "rgba(255,255,255,0.1)";
    });
</script>
</body>
</html>
