<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMARTPHONE COLOR ANALYZER</title>
    <style>
        /* 既存ツールと共通のダークモード・ベーススタイル */
        :root {
            --bg-glass: rgba(0, 0, 0, 0.7);
            --border-glass: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; /* スマホでの不要なスクロール防止 */
            height: 100dvh; /* iOSのツールバーを除いた高さ */
            display: flex;
            flex-direction: column;
        }

        /* 1. カメラビュー（メイン） */
        #camera-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* カメラ映像を全画面にフィット */
        }

        /* 2. 照準（クロスヘア）：画面中央に配置 */
        #aimer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            pointer-events: none; /* タッチイベントを透過 */
            z-index: 10;
        }
        #aimer::before, #aimer::after {
            content: '';
            position: absolute;
            background-color: #fff;
        }
        /* 十字線 */
        #aimer::before { top: 14px; left: -5px; width: 40px; height: 2px; }
        #aimer::after { top: -5px; left: 14px; width: 2px; height: 40px; }

        /* 3. ヘッダー： Virtual Gallery等と同様のミニマル配置 */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            padding-top: calc(15px + env(safe-area-inset-top)); /* iPhoneのノッチ回避 */
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
            z-index: 100;
            pointer-events: none;
        }

        h1 {
            font-size: 14px;
            font-weight: 300;
            margin: 0;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.8);
        }

        /* 4. フローティングGUIパネル：既存ツール群とデザインを統一 */
        .gui-panel {
            position: absolute;
            bottom: calc(20px + var(--safe-area-bottom)); /* iPhoneの下部バー回避 */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 380px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px); /* 背景ぼかし */
            -webkit-backdrop-filter: blur(12px);
            border: var(--border-glass);
            border-radius: 18px;
            padding: 18px;
            box-sizing: border-box;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        /* カラープレビューエリア */
        .color-status {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        #color-preview {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background-color: #ccc; /* 初期色 */
        }

        .color-hex-info {
            flex: 1;
        }

        #hex-value {
            font-size: 24px;
            font-weight: 200;
            letter-spacing: 0.05em;
            margin: 0;
        }

        #color-name {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin: 2px 0 0 0;
        }

        /* 分析・ホールドボタン */
        #hold-btn {
            width: 100%;
            height: 50px; /* 片手で押しやすい高さ */
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: background 0.2s;
            -webkit-appearance: none;
        }

        #hold-btn:active {
            background: rgba(255, 255, 255, 0.25);
        }
        
        #hold-btn.holding {
            background-color: rgba(255, 50, 50, 0.2);
            border-color: rgba(255, 50, 50, 0.5);
        }

    </style>
</head>
<body>

<header>
    <h1>MATERIAL COLOR ANALYZER</h1>
</header>

<!-- カメラ映像エリア -->
<div id="camera-wrapper">
    <video id="video" autoplay playsinline muted></video>
    <!-- 照準 -->
    <div id="aimer"></div>
</div>

<!-- フローティングGUIパネル -->
<div class="gui-panel">
    <div class="color-status">
        <!-- 元のID: result1 (プレビュー) -->
        <div id="color-preview"></div>
        <div class="color-hex-info">
            <!-- 元のID: result2 (HEX値) -->
            <p id="hex-value">#------</p>
            <p id="color-name">DETECTING...</p>
        </div>
    </div>
    
    <!-- ホールドボタン (JSでID: holdButton と関連付ける) -->
    <button id="hold-btn">HOLD COLOR</button>
</div>

<!-- 元のapp.jsをそのまま読み込み -->
<script src="app.js"></script>

<!-- ID名が異なる場合のブリッジ用スクリプト (もしapp.jsが動作しない場合のみコメントアウトを外す) -->

    document.getElementById('result1').id = 'color-preview';
    document.getElementById('result2').id = 'hex-value';
</script>
-->
</body>
</html>
