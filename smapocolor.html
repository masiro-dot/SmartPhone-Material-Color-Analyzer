<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MATERIAL ANALYZER</title>
    <style>
        :root {
            --bg-glass: rgba(0, 0, 0, 0.8);
            --border-glass: rgba(255, 255, 255, 0.2);
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* プレビューエリア */
        #viewer-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        #video, #uploaded-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 照準 */
        #aimer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #aimer::before { content: ''; position: absolute; top: 50%; left: -15px; width: 70px; height: 1px; background: rgba(255,255,255,0.5); }
        #aimer::after { content: ''; position: absolute; left: 50%; top: -15px; width: 1px; height: 70px; background: rgba(255,255,255,0.5); }

        /* ヘッダー */
        header {
            position: absolute;
            top: 0;
            width: 100%;
            padding: calc(20px + var(--safe-top)) 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 100;
        }
        h1 { font-size: 14px; font-weight: 300; margin: 0; letter-spacing: 0.15em; opacity: 0.8; }

        /* GUIパネル */
        .gui-panel {
            position: absolute;
            bottom: calc(25px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 400px;
            background: var(--bg-glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: var(--border-glass);
            border-radius: 24px;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .status-area { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        #color-preview { width: 70px; height: 70px; border-radius: 15px; border: 2px solid #fff; background: #333; transition: background 0.1s; }
        .info-text h2 { font-size: 28px; font-weight: 200; margin: 0; letter-spacing: 0.05em; }
        .info-text p { font-size: 11px; color: rgba(255,255,255,0.5); margin: 2px 0 0 0; letter-spacing: 0.1em; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn {
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { background: rgba(255, 255, 255, 0.25); }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<header><h1>MATERIAL ANALYZER</h1></header>

<div id="viewer-container">
    <video id="video" autoplay playsinline muted></video>
    <img id="uploaded-image" style="display:none;">
    <!-- 色抽出用の隠しキャンバス -->
    <canvas id="hidden-canvas" style="display:none;"></canvas>
    <div id="aimer"></div>
</div>

<div class="gui-panel">
    <div class="status-area">
        <div id="color-preview"></div>
        <div class="info-text">
            <h2 id="hex-value">#------</h2>
            <p id="rgb-value">R:--- G:--- B:---</p>
        </div>
    </div>
    <div class="controls">
        <label class="btn">
            LOAD IMAGE
            <input type="file" id="file-input" accept="image/*">
        </label>
        <button id="hold-btn" class="btn">HOLD COLOR</button>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const image = document.getElementById('uploaded-image');
    const canvas = document.getElementById('hidden-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    const colorPreview = document.getElementById('color-preview');
    const hexText = document.getElementById('hex-value');
    const rgbText = document.getElementById('rgb-value');
    const holdBtn = document.getElementById('hold-btn');
    const fileInput = document.getElementById('file-input');

    let isHolding = false;

    // 1. カメラ起動
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' },
                audio: false
            });
            video.srcObject = stream;
        } catch (err) {
            console.error("Camera error:", err);
        }
    }

    // 2. 画像読み込み
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (f) => {
                image.src = f.target.result;
                image.style.display = 'block';
                video.style.display = 'none';
                isHolding = false;
                holdBtn.style.background = "rgba(255, 255, 255, 0.1)";
            };
            reader.readAsDataURL(file);
        }
    });

    // 3. ホールド機能
    holdBtn.addEventListener('click', () => {
        isHolding = !isHolding;
        holdBtn.style.background = isHolding ? "rgba(255, 50, 50, 0.3)" : "rgba(255, 255, 255, 0.1)";
        holdBtn.innerText = isHolding ? "RELEASE" : "HOLD COLOR";
    });

    // 4. 色抽出コアロジック
    function updateColor() {
        if (isHolding) return;

        const source = (image.style.display === 'block') ? image : video;
        
        // ソースの準備確認
        if (source.tagName === 'VIDEO' && video.readyState < 2) return;
        if (source.tagName === 'IMG' && !image.complete) return;

        // 処理の安定化のため、小さいサイズでサンプリング
        canvas.width = 100;
        canvas.height = 100;
        
        ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
        
        // 中心点（50, 50）のピクセルを取得
        const p = ctx.getImageData(50, 50, 1, 1).data;
        const r = p[0], g = p[1], b = p[2];
        
        const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();

        // 画面更新
        colorPreview.style.backgroundColor = hex;
        hexText.innerText = hex;
        rgbText.innerText = `R:${r} G:${g} B:${b}`;
    }

    // 実行ループ (約30fps)
    setInterval(updateColor, 33);

    startCamera();
</script>
</body>
</html>
