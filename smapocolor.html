<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MATERIAL ANALYZER</title>
    <style>
        :root {
            --bg-glass: rgba(0, 0, 0, 0.75);
            --border-glass: rgba(255, 255, 255, 0.2);
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* プレビューエリア */
        #viewer-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        #video, #uploaded-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 照準 */
        #aimer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #aimer::before { content: ''; position: absolute; top: 50%; left: -15px; width: 70px; height: 1px; background: rgba(255,255,255,0.4); }
        #aimer::after { content: ''; position: absolute; left: 50%; top: -15px; width: 1px; height: 70px; background: rgba(255,255,255,0.4); }

        /* ヘッダー */
        header {
            position: absolute;
            top: 0;
            width: 100%;
            padding: calc(20px + var(--safe-top)) 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 100;
        }
        h1 { font-size: 14px; font-weight: 300; margin: 0; letter-spacing: 0.15em; opacity: 0.8; }

        /* GUIパネル */
        .gui-panel {
            position: absolute;
            bottom: calc(25px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 400px;
            background: var(--bg-glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: var(--border-glass);
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
        }

        .status-area { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        #color-preview { width: 65px; height: 65px; border-radius: 12px; border: 1px solid #fff; background: #222; }
        .info-text h2 { font-size: 26px; font-weight: 200; margin: 0; }
        .info-text p { font-size: 12px; color: rgba(255,255,255,0.5); margin: 0; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { background: rgba(255, 255, 255, 0.25); }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<header><h1>MATERIAL ANALYZER</h1></header>

<div id="viewer-container">
    <video id="video" autoplay playsinline muted></video>
    <img id="uploaded-image" style="display:none;">
    <div id="aimer"></div>
</div>

<div class="gui-panel">
    <div class="status-area">
        <div id="color-preview"></div>
        <div class="info-text">
            <h2 id="hex-value">#------</h2>
            <p id="color-name">READY</p>
        </div>
    </div>
    <div class="controls">
        <label class="btn">
            LOAD IMAGE
            <input type="file" id="file-input" accept="image/*">
        </label>
        <button id="hold-btn" class="btn" style="width:100%">HOLD COLOR</button>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const image = document.getElementById('uploaded-image');
    const fileInput = document.getElementById('file-input');

    // 1. カメラ初期化
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' },
                audio: false
            });
            video.srcObject = stream;
            video.setAttribute("playsinline", true); // iPhone用
            await video.play();
        } catch (err) {
            console.error("Camera access denied or not available", err);
        }
    }

    // 2. 画像読み込み (Load Texture)
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (f) => {
                image.src = f.target.result;
                image.style.display = 'block';
                video.style.display = 'none';
                if(video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }
            };
            reader.readAsDataURL(file);
        }
    });

    // 起動時にカメラ開始
    window.addEventListener('load', initCamera);
</script>
<script src="app.js"></script>
</body>
</html>
