<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MATERIAL ANALYZER</title>
    <style>
        :root {
            --bg-glass: rgba(0, 0, 0, 0.85);
            --border-glass: rgba(255, 255, 255, 0.25);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100dvh;
            overflow: hidden;
        }

        #viewer-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }

        #video, #uploaded-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #aimer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 1.5px solid #fff;
            border-radius: 50%;
            z-index: 10;
            pointer-events: none;
        }
        #aimer::before { content: ''; position: absolute; top: 50%; left: -20px; width: 80px; height: 1.5px; background: #fff; }
        #aimer::after { content: ''; position: absolute; left: 50%; top: -20px; width: 1.5px; height: 80px; background: #fff; }

        .gui-panel {
            position: absolute;
            bottom: calc(20px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: var(--border-glass);
            border-radius: 24px;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
        }

        /* RGB表示：一行に収まるように調整 */
        .rgb-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
        }

        #rgb-display {
            font-size: 34px; /* 1行に収まる最大級のサイズに調整 */
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.01em;
            white-space: nowrap; /* 絶対に改行させない */
            flex: 1;
        }

        #color-preview {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            border: 2px solid #fff;
            flex-shrink: 0;
        }

        .sub-info {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
            margin-bottom: 15px;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            font-weight: 500;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            height: 50px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="viewer-container">
    <video id="video" autoplay playsinline muted></video>
    <img id="uploaded-image" style="display:none;">
    <canvas id="hidden-canvas" style="display:none;"></canvas>
    <div id="aimer"></div>
</div>

<div class="gui-panel">
    <div class="rgb-container">
        <div id="rgb-display">--- --- ---</div>
        <div id="color-preview"></div>
    </div>
    <div class="sub-info">
        <span id="hex-label">HEX: #------</span>
        <span>RGB VALUES</span>
    </div>
    <div class="controls">
        <label class="btn">LOAD IMAGE<input type="file" id="file-input" accept="image/*"></label>
        <button id="hold-btn" class="btn">HOLD</button>
    </div>
</div>

<script>
    const container = document.getElementById('viewer-container');
    const video = document.getElementById('video');
    const image = document.getElementById('uploaded-image');
    const canvas = document.getElementById('hidden-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    const colorPreview = document.getElementById('color-preview');
    const rgbDisplay = document.getElementById('rgb-display');
    const hexLabel = document.getElementById('hex-label');

    let posX = 0, posY = 0, scale = 1;
    let isHolding = false;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(s => video.srcObject = s);

    document.getElementById('file-input').addEventListener('change', e => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = f => {
                image.src = f.target.result;
                image.style.display = 'block'; video.style.display = 'none';
                posX = 0; posY = 0; scale = 1;
                updateTransform();
            };
            reader.readAsDataURL(file);
        }
    });

    let startX, startY;
    container.addEventListener('pointerdown', e => { startX = e.clientX - posX; startY = e.clientY - posY; container.setPointerCapture(e.pointerId); });
    container.addEventListener('pointermove', e => { if (e.buttons !== 1) return; posX = e.clientX - startX; posY = e.clientY - startY; updateTransform(); });
    function updateTransform() {
        const target = (image.style.display === 'block') ? image : video;
        target.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }

    function analyze() {
        if (isHolding) return;
        const source = (image.style.display === 'block') ? image : video;
        if ((source.tagName === 'VIDEO' && video.readyState < 2) || (source.tagName === 'IMG' && !image.complete)) return;

        canvas.width = window.innerWidth / 4;
        canvas.height = window.innerHeight / 4;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        ctx.save();
        ctx.translate(centerX + posX/4, centerY + posY/4);
        const aspect = source.videoWidth ? (source.videoWidth / source.videoHeight) : (source.naturalWidth / source.naturalHeight);
        let dw, dh;
        if (aspect > canvas.width/canvas.height) { dw = canvas.width; dh = dw / aspect; } else { dh = canvas.height; dw = dh * aspect; }
        ctx.drawImage(source, -dw/2, -dh/2, dw, dh);
        ctx.restore();

        const p = ctx.getImageData(centerX, centerY, 1, 1).data;
        colorPreview.style.backgroundColor = `rgb(${p[0]},${p[1]},${p[2]})`;
        rgbDisplay.innerText = `${p[0]} ${p[1]} ${p[2]}`;
        hexLabel.innerText = `HEX: #${((1 << 24) + (p[0] << 16) + (p[1] << 8) + p[2]).toString(16).slice(1).toUpperCase()}`;
    }

    setInterval(analyze, 100);

    document.getElementById('hold-btn').addEventListener('click', function() {
        isHolding = !isHolding;
        this.style.background = isHolding ? "rgba(255, 50, 50, 0.4)" : "rgba(255, 255, 255, 0.1)";
        this.innerText = isHolding ? "RELEASE" : "HOLD";
    });
</script>
</body>
</html>
