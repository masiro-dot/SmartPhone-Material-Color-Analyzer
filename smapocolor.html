<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MATERIAL COLOR ANALYZER</title>
    <style>
        :root {
            --bg-glass: rgba(0, 0, 0, 0.75);
            --border-glass: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body {
            margin: 0;
            background-color: #000;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 1. メイン表示エリア (カメラまたは画像) */
        #viewer-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        #video, #uploaded-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 画像全体が見えるように */
        }

        /* 2. 照準（クロスヘア） */
        #aimer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #aimer::before { content: ''; position: absolute; top: 50%; left: -10px; width: 60px; height: 1px; background: rgba(255,255,255,0.5); }
        #aimer::after { content: ''; position: absolute; left: 50%; top: -10px; width: 1px; height: 60px; background: rgba(255,255,255,0.5); }

        /* 3. ヘッダー (既存ツール踏襲) */
        header {
            position: absolute;
            top: 0;
            width: 100%;
            padding: calc(20px + env(safe-area-inset-top)) 20px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 100;
        }
        h1 { font-size: 14px; font-weight: 300; margin: 0; letter-spacing: 0.2em; opacity: 0.8; }

        /* 4. フローティングGUIパネル */
        .gui-panel {
            position: absolute;
            bottom: calc(20px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: var(--bg-glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: var(--border-glass);
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
        }

        /* カラー情報表示部 */
        .status-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        #color-preview {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            border: 2px solid #fff;
            background: #333;
        }
        .info-text h2 { font-size: 28px; font-weight: 200; margin: 0; }
        .info-text p { font-size: 12px; color: rgba(255,255,255,0.5); margin: 0; }

        /* ボタン群 (Load Texture機能を追加) */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        /* ファイル選択ボタンをスタイリッシュに */
        .custom-file-upload {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 50px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
        }

        button {
            height: 50px;
            background: rgba(255,255,255,0.15);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            -webkit-appearance: none;
        }

        button:active, .custom-file-upload:active {
            background: rgba(255,255,255,0.3);
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

<header>
    <h1>MATERIAL ANALYZER</h1>
</header>

<div id="viewer-container">
    <!-- カメラ映像 -->
    <video id="video" autoplay playsinline muted></video>
    <!-- 取り込んだ画像（初期は非表示） -->
    <img id="uploaded-image" style="display:none;">
    <div id="aimer"></div>
</div>

<div class="gui-panel">
    <div class="status-row">
        <div id="color-preview"></div>
        <div class="info-text">
            <h2 id="hex-value">#------</h2>
            <p id="color-name">READY</p>
        </div>
    </div>

    <div class="button-grid">
        <!-- Load Texture機能 -->
        <label class="custom-file-upload">
            <input type="file" id="load-texture" accept="image/*">
            LOAD TEXTURE
        </label>
        
        <button id="hold-btn">HOLD COLOR</button>
    </div>
</div>

<script>
    // iPhoneでのカメラ起動処理
    const video = document.getElementById('video');
    const image = document.getElementById('uploaded-image');
    const fileInput = document.getElementById('load-texture');

    // カメラ起動
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' },
                audio: false
            });
            video.srcObject = stream;
        } catch (err) {
            console.error("Camera error:", err);
        }
    }

    // 画像読み込み (Load Texture)
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                image.src = event.target.result;
                image.style.display = 'block';
                video.style.display = 'none'; // カメラを隠して画像を表示
            };
            reader.readAsDataURL(file);
        }
    });

    startCamera();
</script>
<script src="app.js"></script>
</body>
</html>
